name: CI

on:
  # D-801: a push to a PR branch also fires `pull_request`, so running on every push ran
  # `checks` twice per PR update. Push runs are kept for `main` only (the post-merge state);
  # every other branch is checked through its pull request.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly 02:00 UTC: slow self-tests
    - cron: "0 4 * * 0" # weekly, Sunday 04:00 UTC: randomized Hypothesis search (D-368)
  workflow_dispatch:

env:
  HYPOTHESIS_PROFILE: ci

# D-806: every job pins its runner image explicitly -- never a `-latest` label. `ubuntu-latest`
# migrates to Ubuntu 26 on 2026-10-19 and `windows-latest` will move on again after that; an OS
# change under the suite is a decision of ours, taken when we can watch the run, not something
# that arrives on GitHub's date in the middle of a task. Moving a pin is a one-line change with
# its own decision. `tests/unit/test_F_X_9_pinned_runners.py` fails on any `-latest` label.
jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    services:
      postgres: # registry DB for the db-marked tests (T03, ADR-004)
        image: postgres:16
        env:
          POSTGRES_USER: sfac
          POSTGRES_PASSWORD: sfac
          POSTGRES_DB: sfac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfac -d sfac"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SFAC_DB_URL: postgresql+psycopg://sfac:sfac@localhost:5432/sfac
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the stream guards diff against the merge base with main
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Stream guards (D-357)
        # Path ownership, D-/P- id ranges and a single Alembic head. On a pull request the
        # base is the PR's base branch; on a push it is origin/main.
        run: |
          git fetch --no-tags origin "${BASE#origin/}"
          uv run sfac streams check --base "$BASE" --branch "$BRANCH"
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Registry migrations
        run: uv run alembic upgrade head
      - name: Tests (fast suite, incl. parity and leakage)
        run: uv run pytest -m "not slow and not db"
      - name: Registry DB tests
        run: uv run pytest -m db -rs --junitxml=db-junit.xml
      - name: Fail if any db test was skipped
        run: |
          uv run python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          suites = ET.parse("db-junit.xml").getroot().iter("testsuite")
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"db tests skipped: {skipped}")
          sys.exit(1 if skipped else 0)
          EOF
      # T15a (D-655): the report opens offline in a real browser -- a headless Chromium behind a
      # dead proxy draws every figure. Like the db tests, it must not be skipped here.
      - name: Report renders offline (headless Chromium)
        run: uv run pytest -m browser -rs --junitxml=browser-junit.xml
      - name: Fail if the browser test was skipped
        run: |
          uv run python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          suites = list(ET.parse("browser-junit.xml").getroot().iter("testsuite"))
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          ran = sum(int(s.get("tests", 0)) for s in suites)
          print(f"browser tests: {ran}, skipped: {skipped}")
          sys.exit(1 if skipped or not ran else 0)
          EOF

  # D-800 (P-54): the work happens on Windows (cp1252 locale, spawn-only
  # processes), CI on Ubuntu with UTF-8 -- so a class of failures is invisible to `checks`
  # (D-377's rationale; #33 and P-52 would both have failed here). Narrow by decision: the fast
  # suite only, on every pull request. No database (no Postgres service on Windows runners),
  # no parity/oracle/leakage (they are platform-independent numerics and run in `checks`), no
  # benchmarks, no lint/type/guards (platform-independent, already in `checks`).
  windows-fast:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Tests (fast suite; no db, parity, oracle, leakage)
        run: >-
          uv run pytest -m "not slow and not db" -p no:cacheprovider
          --ignore=tests/parity --ignore=tests/oracle --ignore=tests/leakage

  nightly-slow:
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Slow self-tests
        # Exit code 5 = no tests collected: accepted here only, while no slow tests exist.
        # Every other job and local run fails when nothing is collected.
        run: uv run pytest -m slow || [ $? -eq 5 ]

  # D-368: the per-PR job is derandomized and `.hypothesis/` is git-ignored, so a falsifying
  # example found on a laptop never reaches CI. This job goes looking for new ones: every
  # Hypothesis test, randomized, with its budget multiplied. It runs on the weekly cron (or by
  # hand) and on no pull request, so a failure REPORTS -- a red scheduled run, with the
  # falsifying example and a reproduction blob in the log and the job summary -- and gates no
  # merge. What it finds is pinned as an `@example` on the test, after which the per-PR job
  # sees it too. No continue-on-error: that would hide the report this job exists for.
  weekly-hypothesis:
    if: github.event.schedule == '0 4 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      HYPOTHESIS_PROFILE: weekly
      # 10x every per-PR budget (D-806, was 40x in D-368). Measured on a GitHub runner in the
      # D-368 review: 10x ran 126 tests in 9 min 33 s, 40x in 29 min 53 s. Runner minutes are
      # free on a public repository, but a half-hour weekly job nobody reads is noise, and a
      # report is only useful if it is read: 10x keeps the search under ten minutes. Raising it
      # again is a decision, not a quiet edit.
      HYPOTHESIS_BUDGET_MULTIPLIER: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync
      - name: Randomized property search (every Hypothesis test)
        run: |
          set -o pipefail
          files=$(grep -rl "@given" tests --include=*.py)
          uv run pytest $files -m "not slow and not db" -p no:cacheprovider -rf 2>&1 | tee hypothesis.log
      - name: Report falsifying examples
        if: failure()
        run: |
          {
            echo "## Weekly Hypothesis search found a failure (D-368)"
            echo
            echo "Pin each falsifying example below as an \`@example\` on its test, then fix the"
            echo "cause. Reproduce locally with the \`@reproduce_failure\` blob."
            echo
            echo '```'
            grep -E -A40 "Falsifying|reproduce_failure|^FAILED" hypothesis.log | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
