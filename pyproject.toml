[project]
name = "strategy-factory"
version = "0.1.0"
description = "Standard, reproducible, auditable funnel for trading-strategy research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "alpaca-py>=0.44.0",
    "arch>=8.0.0",
    "fastapi>=0.142.2",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "polars>=1.30",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.54",
    "sse-starlette>=3.5.0",
    "typer>=0.12",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
    "uvicorn>=0.54.0",
    "yfinance==1.7.0",
]

[project.scripts]
sfac = "strategy_factory.cli:run"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "openpyxl>=3.1.5",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "strategy_factory"

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# One-off inventory tools: long report-template strings and intentional unicode (–, ≈, μ).
"scripts/*" = ["E501", "RUF001"]

[tool.ruff.format]

# --------------------------------------------------------------------------- mypy
# strict for core, data, registry, gates; normal checking elsewhere.
# `strict` is a global-only mypy flag, so it is enabled globally and relaxed below
# for every package that is not in the strict set.
[tool.mypy]
# Alembic scripts (env.py, versions/0001_*.py) are not importable modules
exclude = ["src/strategy_factory/registry/alembic/"]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "strategy_factory.cli",
    "strategy_factory.engine.*",
    "strategy_factory.components.*",
    "strategy_factory.metrics.*",
    "strategy_factory.baseline.*",
    "strategy_factory.diagnostics.*",
    "strategy_factory.robustness.*",
    "strategy_factory.stats.*",
    "strategy_factory.stages.*",
    "strategy_factory.pipeline.*",
    "strategy_factory.reports.*",
    "strategy_factory.evidence.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false
no_implicit_reexport = false
strict_equality = false
extra_checks = false

# The component contract is strict (T07): the more specific module patterns below override
# the relaxed `strategy_factory.components.*` block above.
[[tool.mypy.overrides]]
module = [
    "strategy_factory.components.base",
    "strategy_factory.components.edges",
    "strategy_factory.components.registry",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# The metrics contract (T09) and the backtest glue (T08) are strict: the more specific
# module patterns below override the relaxed `.metrics.*` and `.pipeline.*` blocks above.
[[tool.mypy.overrides]]
module = [
    "strategy_factory.metrics.containers",
    "strategy_factory.metrics.standard",
    "strategy_factory.pipeline.backtest",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

# yfinance, numba and openpyxl ship no type information (py.typed / stubs)
[[tool.mypy.overrides]]
module = ["yfinance", "numba", "numba.*", "openpyxl"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
markers = [
    "slow: long-running self-tests (random walk, planted edge); nightly only",
    "parity: TradingView parity tests (mandatory gate)",
    "leakage: data-truncation / look-ahead tests (mandatory gate)",
    "oracle: comparison against the vectorbt oracle (test-only dependency)",
    "db: needs the PostgreSQL registry (docker compose up -d); must not be skipped in CI",
]
