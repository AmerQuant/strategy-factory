# TF reference on OANDA:XAUUSD 1H (D-348). Every `pine` value below is read from the
# strategy() call of `SF parity TF - Donchian 1H.pine` and cross-checked against the report's
# Properties sheet (no disagreement). Costs come from this block alone (D-362).
name: xauusd_tf_1h
reference:
  chart_data: "OANDA_XAUUSD, 60.csv"
  trade_list: "SF_parity_TF_-_Donchian_1H_OANDA_XAUUSD_2026-09-20.xlsx"
  symbol: "OANDA:XAUUSD"
  timeframe: "60"

pine:                            # every field is required (D-348)
  atr_length: 14                 # script input "ATR length"; D-343
  initial_capital: 100000.0      # strategy(initial_capital)
  qty_type: cash_amount          # strategy.cash
  qty_value: 100000.0            # strategy(default_qty_value)
  commission_type: percent       # strategy.commission.percent
  commission_value: 0.02         # 0.02 % per order
  slippage_ticks: 0
  tick_size: 0.001               # Properties: "Tick size 0.001"
  pyramiding: 0                  # D-004: one position per strategy
  process_orders_on_close: false
  calc_on_every_tick: false
  bar_magnifier: false           # Properties: "Bar detalization: Default (4 ticks per bar)"
  fill_assumptions: "strategy(): fill_orders_on_standard_ohlc = true, calc_on_order_fills = false, margin_long = 0, margin_short = 0"
  # America/New_York, verified: the first trade is stamped 2023-01-04 03:00 and fills at the
  # 08:00 UTC bar whose open is exactly the exported price, 1858.34.
  export_timezone: "America/New_York"

engine:
  initial_capital: 100000.0
  notional: 100000.0
  disaster_stop_atr: 3.0         # D-130; the script's own stop is 2 ATR (see below)
  atr_length: 14                 # must equal pine.atr_length (D-343)
  futures_contracts: 1
  parity_qty_step: 0.01          # D-347: OANDA:XAUUSD

# strategy: the Pine rules are a 20-bar Donchian breakout (long and short), 2-ATR stop,
# 4-ATR target and a 50-bar time exit. Mapped to a registered component in section 3 of
# T11 (D-361); the 2-ATR stop is the spec's sl_atr, not the D-130 disaster stop.
