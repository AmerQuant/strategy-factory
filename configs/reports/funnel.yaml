# The funnel report (D-655, D-668; T15a plan §7). Defaults live in
# strategy_factory.reports.config.ReportConfig (rule 1) and are restated here.
max_candidate_sections: 40      # D-668: every stage-3 entrant gets a section, passes first; the rest a table
spp_bins: 30                    # the SPP histogram's bins (presentation of the stored surface cells)
heatmap_max_symbols: 600        # the universe heatmap draws at most this many symbols per timeframe
# font_file / font_licence default to the package's assets/fonts (D-666)
null_target_share: 0.01         # D-656: T15b's target on the calibrated null
