# Alpaca SIP downloader / adapter settings (T04a). Validated by
# strategy_factory.data.config.AlpacaConfig; every value here has a documented default there.
history_start: 2016-01-01
feed: sip            # decision: SIP for daily and hourly
adjustment: split    # decision: split-adjusted only (TradingView-like)
daily_session: exchange   # 1D session label. Decided in T04i and accepted as D-395: the daily
                          # range lies outside the RTH hourly range on 15,559 of 1,617,247
                          # session days (0.96 %), so "RTH" is wrong. See
                          # docs/reviews/T04i_review.md; the unsupported extremes themselves are
                          # handled by T04k (D-396), not by this label.

rate_limit:
  requests_per_minute: 180   # hard budget: never more requests in any 60 s window
  burst: 10                  # token-bucket capacity (refill = (budget - burst) / 60 s)

retry:
  max_retries: 5
  backoff_base_seconds: 2.0
  backoff_max_seconds: 60.0

batch_size:          # symbols per multi-symbol request (one calendar year per request)
  1D: 100
  1H: 10

hourly_session:      # keep hour-aligned bars labelled 09:00..15:00 New York
  timezone: America/New_York
  first_bar: "09:00"
  regular_close: "16:00"
  sessions_file: configs/calendars/nyse_sessions.csv   # from the Alpaca calendar (T04e)

split_check:
  jump_threshold: 0.40        # |close_t / close_{t-1} - 1| above this is a jump
  match_tolerance: 0.02       # |ln(ratio_alpaca / ratio_crosscheck)| below this = same move
  known_splits_file: configs/data/known_splits.csv
  crosscheck_window_days: 7   # D-399/T04k: nearest cross-check bar, on its own side of a break

relisting:           # re-used tickers and frozen stretches (D-383, amended by D-398)
  frozen_min_sessions: 10   # consecutive bars with an identical close and zero true range
  gap_days: 200             # a break this long is a relisting, not a holiday or a halt
  rename_window_days: 7     # D-700: a rename away agrees with the boundary inside [break - 7 d, boundary]
  names_file: reference/alpaca/alpaca_assets_2026-09-20.v2.csv                    # D-700, under SFAC_RAW_ROOT
  name_changes_file: reference/alpaca/corporate_actions/name_changes_20260920.json   # D-700, the full NAME_CHANGE feed
