# Dukascopy downloader / adapter settings (T04b). Validated by
# strategy_factory.data.config.DukascopyConfig.
# Standard (full) download = h1 bid + ask only. The hourly spread profile (F-0.2.2, later)
# is built from the h1 bid/ask closes (spread = ask_close - bid_close).
h1_start: 2010-01-01          # research series: h1 bid+ask from here (or instrument start)
# m1 is implemented but NOT part of the standard run: only for F-0.3.5 intrabar resolution;
# Dukascopy throttles m1 (HTTP 429) -> run it slowly, when needed.
m1_months: 24                 # m1 bid+ask for the last N complete months (on demand)
universe_file: configs/universe/dukascopy.csv
max_one_sided_share: 0.001    # bars present on one side only: critical above 0.1 %

tool:                         # pinned dukascopy-node (tools/dukascopy, npm ci)
  directory: tools/dukascopy
  retries: 5                  # --retries
  retry_pause_ms: 5000        # --retry-pause
  batch_size: 5               # --batch-size (m1 months are ~30 daily artifacts; Dukascopy throttles with HTTP 429)
  batch_pause_ms: 2000        # --batch-pause
  volume_units: units         # --volumes --volume-units
  utc_offset_minutes: 0       # --utc-offset (0 = UTC; the adapter corrects any other value)
  timeout_seconds: 900        # per CLI call
  call_retries: 3             # wrapper: re-run a month that still ends in HTTP 429/5xx
  call_backoff_seconds: 30    # wrapper backoff: 30 s, 60 s, 120 s

# D-672: flagged bars verified as real market moves. Kept unchanged; the D-717 re-measure
# (scripts/analysis/T04j_defects.py) reports them and does not stop on them. Any other flag stops.
# Correcting or removing such a bar would make every backtest on the instrument optimistic.
verified_events:
  - symbol: USDCHF
    ts: 2015-01-15T09:00:00Z
    family: wick_flags
    source: >-
      Swiss National Bank removes the EUR/CHF minimum exchange rate of 1.20, announced
      2015-01-15 09:30 UTC; USDCHF reprices from 1.02 to 0.73-0.88 and never returns to 1.02
      (Dukascopy h1: L 0.72705, C 0.87536). A stage-6 crisis period (D-150).
    decision: D-672
