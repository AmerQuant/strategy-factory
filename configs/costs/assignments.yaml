# Cost-profile assignments (T06). A symbol entry wins over its asset-class group.
# Every symbol of the tradable universe (configs/universe/us_equity_*.csv, dukascopy.csv)
# must resolve to a profile: `sfac costs validate` fails otherwise (costs are mandatory).
groups:                                 # asset_class -> profile
  us_equity: us_equity_default
  fx: fx_default
  metal: metal_default
  index_cfd: index_cfd_default
  energy_cfd: energy_cfd_default
symbols:                                # symbol -> profile (+ overrides of profile fields)
  USDJPY: {profile: fx_default, overrides: {pip_size: 0.01}}
  EURJPY: {profile: fx_default, overrides: {pip_size: 0.01}}
  GBPJPY: {profile: fx_default, overrides: {pip_size: 0.01}}
  AUDJPY: {profile: fx_default, overrides: {pip_size: 0.01}}
  CADJPY: {profile: fx_default, overrides: {pip_size: 0.01}}
stress_multipliers: [1.5, 2.0, 3.0]     # F-0.2.4: applied to spread and slippage only
