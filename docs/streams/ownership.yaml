# Path ownership between the two Claude Code streams (D-355, D-357 (2)).
#
# A branch whose name starts with `a/` belongs to stream A, `b/` to stream B. The CI guard
# `sfac streams check` refuses a branch that changes a path owned by the *other* stream.
# Branches without a prefix are grandfathered and are not checked (D-357).
#
# Matching: the longest matching pattern wins, so a specific file can override its folder. A
# pattern is a path prefix, or a whole-path glob when it contains `*` (`*` within one segment,
# `**/` any number of whole segments; D-658).
# `shared` paths may be changed by either stream; everything not listed is shared.

# The supervisor's own ranges (D-355). Decisions only: a P- number always belongs to the
# stream that raised the question. D-355 … D-359 is used up (D-355, D-356, D-357, D-359), so
# D-600 … D-699 follows it.
# D-677 (2026-10-03): only stream A writes them; the other sessions record a supervisor-settled
# decision in their own range, marked (supervisor). The guard checks the rows a branch adds or
# amends, never the rows already in the log (D-672 … D-674, written by stream B, stay valid).
supervisor:
  decisions:
    - [355, 359]
    - [600, 699]
  writers: [A]

streams:
  A:
    name: stream A (main folder, StrategyFactory)
    branch_prefix: "a/"
    folder: StrategyFactory          # D-357 (1): the only folder this stream may work in
    # D-378: D-360 … D-379 is used up (D-379 is the last), so the supervisor granted
    # D-800 … D-899 next to it -- the same shape as stream B's second range (D-372).
    decisions: [[360, 379], [800, 899]]
    # D-803: P-40 … P-59 is used up (P-59 was the last), so the supervisor granted
    # P-100 … P-149 -- the same shape as the decision ranges.
    pending: [[40, 59], [100, 149]]
  B:
    name: stream B (worktree, StrategyFactory_B)
    branch_prefix: "b/"
    folder: StrategyFactory_B        # D-357 (1)
    # D-372: D-380 … D-399 is used up (D-399 was the last), so the supervisor granted
    # D-700 … D-799 next to it.
    decisions: [[380, 399], [700, 799]]
    # D-376: P-60 … P-79 is used up too, so the supervisor granted P-80 … P-99 next to it.
    # D-676: and P-150 … P-199 as its third pending range (2026-09-30), still its own.
    pending: [[60, 79], [80, 99], [150, 199]]

owners:
  # -- stream A only; a stream-B need for any of these is a P- question (D-357 (2)) ----------
  HANDOFF.md: A                       # written by A at merges, from both stream files
  CLAUDE.md: A
  docs/STANDING_PROMPT.md: A
  .github/: A
  pyproject.toml: A
  uv.lock: A
  src/strategy_factory/registry/alembic/: A   # migrations: one head, A owns them
  configs/universe.yaml: A            # regenerated by A after a stream-B merge (D-394)
  # D-611 (P-51): stream A implements T12, so it owns the paths T12 builds on and adds.
  # `components/` keeps its owner past T11's merge instead of lapsing (supersedes that part
  # of D-357 (2)).
  src/strategy_factory/components/: A
  src/strategy_factory/stages/: A
  src/strategy_factory/baseline/: A
  src/strategy_factory/metrics/: A
  configs/gates/: A
  configs/stages/: A                  # D-612: T12 writes configs/stages/s01_edge.yaml
  docs/streams/A.md: A

  # D-658 (T16): the stage-7 statistics library is stream B's. `stats/edge.py` predates it: it is
  # stage 1's and stage 2's statistic (percentile, empirical p, Benjamini-Hochberg; T12, D-611),
  # imported by `stages/`, so the file stays stream A's -- the longest pattern wins.
  src/strategy_factory/stats/edge.py: A

  # -- stream B only -------------------------------------------------------------------------
  configs/universe/: B                # the symbol lists and symbol_changes.csv (D-394)
  docs/streams/B.md: B
  src/strategy_factory/stats/: B      # D-658: the stage-7 statistics library (T16)
  src/strategy_factory/api/: B        # D-678: the admin UI's API (FastAPI)
  ui/: B                              # D-678: the admin UI's front end
  docs/streams/B_ui.md: B             # D-678: the UI session's status file
  tests/**/test_F_7_*: B              # D-658: its tests, in any test folder (a glob, see below)

# Append-only for everyone, per the stream's own ID range (D-357 (2)); the ID guard checks the
# range, not the ownership.
append_only:
  - docs/decisions/decisions_log.md
  - docs/decisions/pending.md

# Explicitly shared, listed so the intent is on the record rather than implied.
shared:
  - docs/tasks/
  - docs/reviews/
  - docs/adr/
  - src/strategy_factory/          # except the stream-A paths above
  - tests/
  - configs/                       # except the two entries above
  - scripts/
